name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest -v

  dag-validation:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Airflow (constrained, for DAG validation only)
        run: |
          pip install "apache-airflow==2.10.4" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.4/constraints-3.12.txt"

      - name: Install project dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate DAG loads without errors
        env:
          AIRFLOW_HOME: /tmp/airflow
        run: |
          python -c "
          from airflow.models import DagBag
          bag = DagBag(dag_folder='dags', include_examples=False)
          assert not bag.import_errors, f'Import errors: {bag.import_errors}'
          assert 'telecom_ops_etl' in bag.dags, 'DAG telecom_ops_etl not found'
          dag = bag.dags['telecom_ops_etl']
          assert len(dag.tasks) == 5, f'Expected 5 tasks, got {len(dag.tasks)}'
          assert dag.get_task('extract').retries == 2
          assert dag.get_task('load').retries == 2
          assert dag.get_task('validate').retries == 0
          assert dag.get_task('cleanup').retries == 0
          print('DAG OK — tasks:', [t.task_id for t in dag.tasks])
          "

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate synthetic source data
        run: python scripts/generate_fake_data.py

      - name: Create .env for CI
        run: cp .env.example .env

      - name: Build and start Postgres + app
        run: docker compose up --build -d postgres app

      - name: Wait for app container to finish
        run: |
          EXIT_CODE=$(docker wait telecom_ops_app)
          echo "App container exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Pipeline container failed"
            exit "$EXIT_CODE"
          fi

      - name: Show app logs
        if: always()
        run: docker logs telecom_ops_app

      - name: Verify data landed in Postgres
        run: |
          COUNT=$(docker exec telecom_ops_db psql -U telecom_admin -d telecom_ops -t -A -c "SELECT COUNT(*) FROM fact_work_orders;")
          LINES=$(docker exec telecom_ops_db psql -U telecom_admin -d telecom_ops -t -A -c "SELECT COUNT(*) FROM fact_work_order_materials;")
          echo "Fact rows loaded: $COUNT"
          echo "Material lines loaded: $LINES"
          if [ "$COUNT" -lt 1 ]; then
            echo "No rows loaded - pipeline failed silently"
            exit 1
          fi
          if [ "$LINES" -lt 1 ]; then
            echo "No material lines loaded"
            exit 1
          fi
          echo "FACT_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "LINE_COUNT=$LINES" >> "$GITHUB_ENV"
          docker exec telecom_ops_db psql -U telecom_admin -d telecom_ops -c "SELECT COUNT(*) FROM quarantine_records;"

      - name: Re-run pipeline and verify upsert did not duplicate facts
        run: |
          docker compose run --rm --no-deps --name telecom_ops_app_rerun app
          COUNT2=$(docker exec telecom_ops_db psql -U telecom_admin -d telecom_ops -t -A -c "SELECT COUNT(*) FROM fact_work_orders;")
          LINES2=$(docker exec telecom_ops_db psql -U telecom_admin -d telecom_ops -t -A -c "SELECT COUNT(*) FROM fact_work_order_materials;")
          echo "Fact rows after second run: $COUNT2"
          echo "Material lines after second run: $LINES2"
          if [ "$COUNT2" != "$FACT_COUNT" ]; then
            echo "Expected upsert to keep $FACT_COUNT fact rows, got $COUNT2"
            exit 1
          fi
          if [ "$LINES2" != "$LINE_COUNT" ]; then
            echo "Expected upsert to keep $LINE_COUNT material lines, got $LINES2"
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v