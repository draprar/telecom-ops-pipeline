services:
  postgres:
    image: postgres:16
    container_name: telecom_ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: telecom_admin
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: telecom_ops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom_admin -d telecom_ops"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  app:
    build: .
    container_name: telecom_ops_app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./data:/app/data

  airflow:
    image: apache/airflow:2.10.4
    container_name: telecom_ops_airflow
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      AIRFLOW_HOME: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary python-dotenv"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - airflow_home:/opt/airflow
    command: standalone

volumes:
  pgdata:
  airflow_home: