services:
  postgres:
    image: postgres:16
    container_name: telecom_ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is now owned by Alembic (see migrations/), not by an initdb
      # script - the app container applies `alembic upgrade head` on start.

  # One-off: apply migrations without running the full pipeline. Useful when
  # you only want to bring up Airflow (which does not run migrations itself).
  #   docker compose run --rm migrate
  migrate:
    build: .
    container_name: telecom_ops_migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DB_HOST: postgres
    entrypoint: ["alembic", "upgrade", "head"]
    profiles: ["tools"]

  app:
    build: .
    container_name: telecom_ops_app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DB_HOST: postgres
    volumes:
      - ./data:/app/data

  airflow:
    image: apache/airflow:2.10.4
    container_name: telecom_ops_airflow
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DB_HOST: postgres
      AIRFLOW_HOME: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary python-dotenv requests"
      # Airflow Connection for the pipeline's Postgres access, in URI form,
      # instead of load.py reading raw env vars. See src/load.py get_connection().
      AIRFLOW_CONN_TELECOM_OPS_POSTGRES: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      # Optional: set in .env.example to get Slack alerts on task failure (dags/alerts.py).
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - airflow_home:/opt/airflow
    command: standalone

volumes:
  pgdata:
  airflow_home:
