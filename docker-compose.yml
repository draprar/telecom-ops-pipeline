services:
  postgres:
    image: postgres:16
    container_name: telecom_ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  app:
    build: .
    container_name: telecom_ops_app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./data:/app/data

  airflow:
    # slim image: no unused providers (Azure/GCP/AWS/...) baked in - ~500MB
    # vs ~1.1GB for the regular image, and noticeably faster container
    # startup. Fine here since the DAG only uses plain psycopg2, not any
    # Airflow provider hook.
    image: apache/airflow:slim-2.10.4-python3.12
    container_name: telecom_ops_airflow
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      AIRFLOW_HOME: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary python-dotenv"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - airflow_home:/opt/airflow
    command: standalone

volumes:
  pgdata:
  airflow_home: