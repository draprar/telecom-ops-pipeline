services:
  postgres:
    image: postgres:16
    container_name: telecom_ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No more docker-entrypoint-initdb.d/schema.sql here - schema is now
      # owned by Alembic (see the `migrate` service below). sql/schema.sql
      # is kept only as a historical reference of the final shape; it is
      # not applied automatically anymore. Mounting both would fail on a
      # fresh database anyway (schema.sql creates the tables, then Alembic
      # would try to create them again and hit "relation already exists").

  migrate:
    # Same image as `app` - just runs `alembic upgrade head` instead of the
    # pipeline. One image, two jobs, instead of maintaining a second image
    # solely to run migrations.
    build: .
    container_name: telecom_ops_migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    command: ["alembic", "upgrade", "head"]

  app:
    build: .
    container_name: telecom_ops_app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./data:/app/data

  airflow:
    # slim image: no unused providers (Azure/GCP/AWS/...) baked in - ~500MB
    # vs ~1.1GB for the regular image, and noticeably faster container
    # startup. apache-airflow-providers-postgres is added explicitly below
    # since slim ships with none of the database providers.
    image: apache/airflow:slim-2.10.4-python3.12
    container_name: telecom_ops_airflow
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      AIRFLOW_HOME: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary python-dotenv apache-airflow-providers-postgres==5.14.0"
      # Airflow-native Connection for the DAG's load_task, instead of the
      # os.getenv()/.env read that scripts/run_pipeline.py still uses. This
      # is the standard env-var form of a Connection - Airflow resolves it
      # by ID (postgres_default) exactly like one created in the UI. The
      # honest trade-off: unlike a UI/CLI-created Connection, this one is
      # not a row in the metadata DB, so it's not editable from the
      # Connections page - changing it means changing this env var (and
      # restarting the container), not touching DAG code either way.
      AIRFLOW_CONN_POSTGRES_DEFAULT: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${DB_PORT}/${POSTGRES_DB}"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - airflow_home:/opt/airflow
    command: standalone

volumes:
  pgdata:
  airflow_home: